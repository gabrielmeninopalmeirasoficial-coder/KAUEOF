<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo - Doação com PIX Vizzionpay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .amounts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    .btn-amount {
      padding: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-amount:hover {
      border-color: #667eea;
      color: #667eea;
      background: #f5f7ff;
    }

    .btn-amount.popular {
      border-color: #ffc107;
      background: #fffbf0;
    }

    .custom-amount {
      margin-bottom: 30px;
    }

    .custom-amount label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-amount input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .custom-amount input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn-donate-main {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
      font-family: inherit;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-donate-main:hover {
      transform: translateY(-2px);
    }

    .btn-donate-main:active {
      transform: scale(0.98);
    }

    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 8px;
      margin-top: 30px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .info-box strong {
      color: #333;
    }

    .badge {
      display: inline-block;
      background: #ffc107;
      color: #333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💚 Faça uma Doação</h1>
    <p class="subtitle">Escolha um valor ou defina um valor personalizado</p>

    <!-- Grid de valores predefinidos -->
    <div class="amounts-grid">
      <button class="btn-amount" onclick="vizzionPixAbrirModal(5000, 'R$ 50,00')">
        R$ 50,00
      </button>
      <button class="btn-amount" onclick="vizzionPixAbrirModal(10000, 'R$ 100,00')">
        R$ 100,00
      </button>
      <button class="btn-amount" onclick="vizzionPixAbrirModal(15000, 'R$ 150,00')">
        R$ 150,00
      </button>
      <button class="btn-amount popular" onclick="vizzionPixAbrirModal(25000, 'R$ 250,00')">
        R$ 250,00 <span class="badge">POPULAR</span>
      </button>
      <button class="btn-amount" onclick="vizzionPixAbrirModal(50000, 'R$ 500,00')">
        R$ 500,00
      </button>
      <button class="btn-amount" onclick="vizzionPixAbrirModal(100000, 'R$ 1.000,00')">
        R$ 1.000,00
      </button>
    </div>

    <!-- Valor personalizado -->
    <div class="custom-amount">
      <label for="customValue">Valor Personalizado (R$)</label>
      <input 
        type="number" 
        id="customValue" 
        placeholder="Digite um valor (ex: 75)" 
        min="1" 
        step="0.01"
      >
    </div>

    <!-- Botão principal -->
    <button class="btn-donate-main" onclick="gerarPixCustom()">
      🎁 Gerar PIX Agora
    </button>

    <!-- Caixa de informação -->
    <div class="info-box">
      <strong>✓ Como funciona:</strong><br>
      1. Escolha um valor acima<br>
      2. Clique em "Gerar PIX Agora"<br>
      3. Escaneie o QR Code com seu banco<br>
      4. Confirme o pagamento<br>
      <br>
      Sua doação é 100% segura e processada via <strong>Vizzionpay</strong>.
    </div>
  </div>

  <!-- Script de Checkout PIX com Vizzionpay -->
  <script>
    // ⚙️ CONFIGURAÇÃO
    const BACKEND_URL = 'https://pix-backend-4c35.onrender.com';
    
    // 🎨 HTML DO MODAL (mesmo do pix-checkout.js)
    var modalHTML = '<div id="vizzion-pix-modal" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">'
      + '<div style="background:#fff;border-radius:12px;padding:28px 24px;max-width:360px;width:94%;text-align:center;position:relative;font-family:\'DM Sans\', Lato,sans-serif;">'
      + '<button onclick="vizzionPixFecharModal()" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;color:#888;cursor:pointer;line-height:1;">×</button>'
      + '<div style="margin-bottom:16px;">'
      + '<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(102, 126, 234, 0.1);border:1px solid rgba(102, 126, 234, 0.3);border-radius:100px;padding:4px 12px;font-size:11px;color:#667eea;font-weight:700;margin-bottom:10px;"><span style="width:6px;height:6px;background:#667eea;border-radius:50%;"></span> Vizzionpay PIX</div>'
      + '<h3 id="vizzion-titulo" style="margin:0 0 4px;font-size:18px;font-weight:700;color:#1a1a1a;">Gerando seu PIX...</h3>'
      + '<p id="vizzion-valor" style="margin:0;font-size:13px;color:#666;"></p>'
      + '</div>'
      + '<div id="vizzion-loading" style="padding:30px 0;">'
      + '<div style="width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#667eea;border-radius:50%;margin:0 auto 12px;animation:vizzionSpin 0.8s linear infinite;"></div>'
      + '<p style="color:#888;font-size:13px;margin:0;">Aguarde...</p>'
      + '</div>'
      + '<div id="vizzion-qr" style="display:none;">'
      + '<img id="vizzion-qr-img" src="" alt="QR Code PIX" style="width:200px;height:200px;margin:0 auto 14px;display:block;border-radius:8px;" />'
      + '<p style="font-size:12px;color:#666;margin:0 0 8px;">Ou copie o código PIX:</p>'
      + '<div style="display:flex;gap:8px;align-items:center;background:#f5f5f5;border-radius:8px;padding:8px 12px;margin-bottom:16px;">'
      + '<input id="vizzion-copia-cola" type="text" readonly style="flex:1;border:none;background:none;font-size:11px;color:#333;outline:none;font-family:monospace;" />'
      + '<button onclick="vizzionPixCopiarCodigo()" style="background:#667eea;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">Copiar</button>'
      + '</div>'
      + '<p id="vizzion-copiado" style="display:none;color:#667eea;font-size:12px;font-weight:700;margin:0 0 12px;">✓ Código copiado!</p>'
      + '<p style="font-size:11px;color:#aaa;margin:0;">O QR Code expira em 30 minutos.</p>'
      + '</div>'
      + '<div id="vizzion-erro" style="display:none;padding:16px 0;">'
      + '<p style="color:#e74c3c;font-size:14px;margin:0 0 12px;">Não foi possível gerar o PIX.<br>Tente novamente.</p>'
      + '<button onclick="vizzionPixFecharModal()" style="background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;">Fechar</button>'
      + '</div>'
      + '</div></div>'
      + '<style>@keyframes vizzionSpin{to{transform:rotate(360deg)}}</style>';

    document.body.insertAdjacentHTML('beforeend', modalHTML);

    // 🎯 ABRIR MODAL E GERAR PIX
    window.vizzionPixAbrirModal = function (amountCents, labelValor) {
      var modal   = document.getElementById('vizzion-pix-modal');
      var loading = document.getElementById('vizzion-loading');
      var qrDiv   = document.getElementById('vizzion-qr');
      var erroDiv = document.getElementById('vizzion-erro');
      var titulo  = document.getElementById('vizzion-titulo');
      var valorEl = document.getElementById('vizzion-valor');

      loading.style.display = 'block';
      qrDiv.style.display   = 'none';
      erroDiv.style.display = 'none';
      titulo.textContent    = 'Gerando seu PIX...';
      valorEl.textContent   = 'Valor: ' + labelValor;
      modal.style.display   = 'flex';
      document.body.style.overflow = 'hidden';

      // 📡 REQUISIÇÃO AO BACKEND
      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amountCents: amountCents })
      })
      .then(function (res) { 
        if (!res.ok) throw new Error('Resposta do servidor inválida');
        return res.json(); 
      })
      .then(function (data) {
        if (data && data.pixCopyPaste) {
          var qrCodeUrl = data.qrCode || 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(data.pixCopyPaste);
          
          document.getElementById('vizzion-qr-img').src = qrCodeUrl;
          document.getElementById('vizzion-copia-cola').value = data.pixCopyPaste;
          
          titulo.textContent    = '✓ PIX gerado!';
          valorEl.textContent   = 'Valor: ' + labelValor;
          
          loading.style.display = 'none';
          qrDiv.style.display   = 'block';
        } else {
          throw new Error('Resposta inválida');
        }
      })
      .catch(function (error) {
        console.error('Erro ao gerar PIX:', error);
        loading.style.display = 'none';
        erroDiv.style.display = 'block';
      });
    };

    // ❌ FECHAR MODAL
    window.vizzionPixFecharModal = function () {
      document.getElementById('vizzion-pix-modal').style.display = 'none';
      document.body.style.overflow = '';
    };

    // 📋 COPIAR CÓDIGO PIX
    window.vizzionPixCopiarCodigo = function () {
      var input = document.getElementById('vizzion-copia-cola');
      navigator.clipboard.writeText(input.value).then(function () {
        document.getElementById('vizzion-copiado').style.display = 'block';
        setTimeout(function () {
          document.getElementById('vizzion-copiado').style.display = 'none';
        }, 2500);
      }).catch(function () {
        input.select();
        document.execCommand('copy');
        document.getElementById('vizzion-copiado').style.display = 'block';
        setTimeout(function () {
          document.getElementById('vizzion-copiado').style.display = 'none';
        }, 2500);
      });
    };

    // 🔗 FECHAR AO CLICAR NO OVERLAY
    document.getElementById('vizzion-pix-modal').addEventListener('click', function (e) {
      if (e.target === this) vizzionPixFecharModal();
    });

    // 💰 FUNÇÃO PARA VALOR PERSONALIZADO
    window.gerarPixCustom = function () {
      var input = document.getElementById('customValue');
      var valor = parseFloat(input.value);
      
      if (!valor || valor <= 0) {
        alert('Por favor, digite um valor válido!');
        return;
      }
      
      var cents = Math.round(valor * 100);
      var label = 'R$ ' + valor.toFixed(2).replace('.', ',');
      
      vizzionPixAbrirModal(cents, label);
    };
  </script>

</body>
</html>
